[workspace]
resolver = "2"

members = [
    "crates/rusanta-array",
    "crates/rusanta-core",
    "crates/rusanta-frame",
    "crates/rusanta-tensor",
    "crates/rusanta-viz",
    "crates/rusanta-stat-viz",
    "crates/rusanta-ml",
    "crates/rusanta-triton",
]

[workspace.package]
version = "0.1.0"
edition = "2026"
license = "MIT"
authors = ["Santanam Wishal, Charlene Silver, Rusanta Team & Contributors"]
repository = "https://github.com/rusantaa/rusanta"

[workspace.dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
